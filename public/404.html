<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada (404) | Estudio Anabella Zalazar</title>
  <script>
    // Enrutamiento inteligente para GitHub Pages (SPA y rutas amigables)
    (function() {
      var p = window.location.pathname;
      var s = window.location.search;
      var h = window.location.hash;

      // 1. Redirección si se abrió /admin/proyecto.html?slug=...
      if (p.indexOf('admin/proyecto.html') !== -1 || p.indexOf('/admin/proyecto.html') !== -1) {
        window.location.replace('/proyecto.html' + s + h);
        return;
      }

      // 2. Redirección si se abrió /admin/pagina.html?slug=...
      if (p.indexOf('admin/pagina.html') !== -1 || p.indexOf('/admin/pagina.html') !== -1) {
        window.location.replace('/pagina.html' + s + h);
        return;
      }

      // 3. Redirección limpia para /proyecto/mi-slug -> /proyecto.html?slug=mi-slug
      if (p.indexOf('/proyecto/') !== -1) {
        var slug = p.split('/proyecto/')[1];
        if (slug) {
          slug = slug.replace(/\/$/, '');
          window.location.replace('/proyecto.html?slug=' + encodeURIComponent(slug) + (s ? '&' + s.substring(1) : '') + h);
          return;
        }
      }

      // 4. Redirección limpia para /p/mi-slug -> /pagina.html?slug=mi-slug
      if (p.indexOf('/p/') !== -1) {
        var slugP = p.split('/p/')[1];
        if (slugP) {
          slugP = slugP.replace(/\/$/, '');
          window.location.replace('/pagina.html?slug=' + encodeURIComponent(slugP) + (s ? '&' + s.substring(1) : '') + h);
          return;
        }
      }

      // 5. Redirección si se abrió /admin sin barra final
      if (p === '/admin') {
        window.location.replace('/admin/');
        return;
      }
    })();
  </script>
  <link rel="icon" type="image/png" href="/static/img/logop.png">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .error-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-family: var(--font-display);
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 800;
      color: var(--accent-terracotta);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title {
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      color: var(--text-primary);
      margin-bottom: 1rem;
    }
    .error-desc {
      color: var(--text-secondary);
      font-size: 1.1rem;
      max-width: 500px;
      margin-bottom: 2.5rem;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Espacio no encontrado</h1>
    <p class="error-desc">La página o el proyecto que buscas no existe, ha sido reubicado o se encuentra temporalmente despublicado.</p>
    <a href="/" class="btn-primary">Volver a la Página Principal <span>→</span></a>
  </div>
</body>
</html>
